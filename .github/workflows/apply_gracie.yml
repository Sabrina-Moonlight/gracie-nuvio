name: Apply Gracie

# Aplica las modificaciones de Gracie's Nuvio (carpeta gracie-nuvio) sobre el Nuvio oficial que dejó Fetch Original.
# Orden: 1) Fetch Original Nuvio con ref = 0.6.10   2) Apply Gracie   3) Release
# Si el original no es 0.6.10 (build 153), el script se detiene sin cambiar nada.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unzip-main
  cancel-in-progress: false

jobs:
  aplicar:
    name: Apply Gracie mods
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar modificaciones
        env:
          RAMA: ${{ github.ref_name }}
        run: |
          set -eu
          [ -f gracie-nuvio/apply_gracie.sh ] || { echo "::error::Falta gracie-nuvio/apply_gracie.sh"; exit 1; }
          bash gracie-nuvio/apply_gracie.sh
          [ -f gradlew ] && chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "- Las modificaciones ya estaban aplicadas." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "chore: aplicar modificaciones de Gracie's Nuvio"
            git push origin "HEAD:refs/heads/$RAMA"
            echo "- Modificaciones aplicadas en main." >> "$GITHUB_STEP_SUMMARY"
          fi
