name: Release APK (personal)

on:
  workflow_dispatch:

jobs:
  build_release:
    name: Build Nuvio Android Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      # El runner gratis tiene ~7 GB de RAM. Agregamos 10 GB de swap para que Gradle no sea matado (exit 143).
      - name: Add swap
        run: |
          free -h
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Same signing key on every build, so each APK installs as an update over the previous one.
      # The key lives in the repo secret DEBUG_KEYSTORE_BASE64 (Settings > Secrets and variables > Actions).
      - name: Prepare signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret DEBUG_KEYSTORE_BASE64 (o esta vacio). Sin el, el APK no se puede instalar como actualizacion. Revisa Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          KS="$RUNNER_TEMP/nuvio-release.jks"
          echo "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KS"
          keytool -list -keystore "$KS" -storepass android -alias androiddebugkey > /dev/null \
            || { echo "::error::El secret DEBUG_KEYSTORE_BASE64 no es una llave valida (alias androiddebugkey, clave android)."; exit 1; }
          {
            echo "NUVIO_RELEASE_STORE_FILE=$KS"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
          } > local.properties
          echo "Using persistent signing key from secret."

      - name: Build Full Release APKs
        # Memoria bajada a lo que cabe en el runner (gradle.properties pide 12 GB + 8 GB, no caben).
        # Kotlin corre dentro del mismo proceso de Gradle: un solo JVM, sin daemon.
        run: >
          ./gradlew :androidApp:assembleFullRelease
          --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4608m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          -Pkotlin.native.jvmArgs=-Xmx1g
          --console=plain --warning-mode summary --stacktrace

      - name: Show APK signing fingerprint
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -n 1)
          for f in androidApp/build/outputs/apk/full/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$f" | grep -i "SHA-256" | tee -a "$GITHUB_STEP_SUMMARY"
          done || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-release
          path: androidApp/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
